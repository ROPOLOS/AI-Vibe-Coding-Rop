<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>League of Bomberman: Teemo's Revenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body { 
            font-family: 'Press Start 2P', cursive; 
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            user-select: none;
            overflow: hidden; /* Prevent scrolling on arrow keys */
        }
        
        canvas { 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 0 4px #475569; 
            border-radius: 4px;
            image-rendering: pixelated;
        }
        
        .overlay { 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(4px); 
        }

        /* Subtle pulsating effect for the title */
        @keyframes pulse-text {
            0%, 100% { text-shadow: 0 0 10px #4ade80, 0 0 20px #4ade80; }
            50% { text-shadow: 0 0 5px #4ade80, 0 0 10px #22c55e; }
        }
        .title-glow { animation: pulse-text 2s infinite; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen m-0 relative">

    <div class="mb-4 text-center z-10">
        <h1 class="text-2xl text-green-400 mb-3 mt-4 title-glow">TEEMO BOMBER</h1>
        <p class="text-[10px] text-slate-400 leading-relaxed max-w-md mx-auto">
            Use <span class="text-white">WASD / ARROWS</span> to navigate the grid.<br>
            Press <span class="text-white">SPACE</span> to plant a Mushroom Bomb.<br>
            Eliminate all champions to win!
        </p>
    </div>

    <div class="relative inline-block mt-2">
        <canvas id="gameCanvas" width="600" height="600" class="bg-green-900"></canvas>
        
        <!-- UI Overlay for Game Over / Victory -->
        <div id="ui-layer" class="overlay absolute inset-0 hidden flex-col items-center justify-center rounded z-20">
            <h2 id="ui-title" class="text-3xl mb-6 text-center leading-tight"></h2>
            <button id="restart-btn" class="px-6 py-4 bg-slate-700 hover:bg-slate-600 text-white rounded cursor-pointer border-2 border-slate-400 uppercase text-xs transition-colors shadow-lg active:scale-95">
                Play Again
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiLayer = document.getElementById('ui-layer');
        const uiTitle = document.getElementById('ui-title');
        const restartBtn = document.getElementById('restart-btn');

        // Game Constants
        const TILE_SIZE = 40;
        const ROWS = 15;
        const COLS = 15;
        const FPS = 60;
        const TIME_STEP = 1000 / FPS;

        // Emojis mapping
        const ASSETS = {
            WALL: '🧱',
            BOX: '📦',
            PLAYER: '🦝',
            BOMB: '🍄',
            EXPLOSION: '💥',
            GAREN: '🗡️',
            BLITZCRANK: '🤖',
            SHACO: '🤡'
        };

        // State Variables
        let map = [];
        let player;
        let enemies = [];
        let bombs = [];
        let explosions = [];
        let keys = {};
        let gameOver = false;
        let gameWon = false;
        let lastTime = 0;
        let accumulator = 0;
        let spacePressed = false;

        // Key tracking
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            // Prevent default browser scrolling for game keys
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Initialize Map Array
        // 0 = Floor, 1 = Indestructible Wall, 2 = Destructible Box
        function initMap() {
            map = [];
            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) {
                    if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) {
                        row.push(1); // Outer bounds
                    } else if (r % 2 === 0 && c % 2 === 0) {
                        row.push(1); // Checkerboard inner walls
                    } else {
                        // Keep top left empty for safe spawn
                        if ((r === 1 && c === 1) || (r === 1 && c === 2) || (r === 2 && c === 1)) {
                            row.push(0);
                        } else {
                            // 60% chance for a box
                            row.push(Math.random() < 0.6 ? 2 : 0);
                        }
                    }
                }
                map.push(row);
            }
        }

        // Validate if entity can walk to tile
        function isWalkable(x, y) {
            if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
            if (map[y][x] !== 0) return false; // Blocked by wall or box
            
            // Blocked by bombs (Entities can't walk into bombs)
            if (bombs.some(b => b.gridX === x && b.gridY === y)) return false;
            
            return true;
        }

        // Entity Base Class
        class Entity {
            constructor(x, y, type, speed) {
                this.x = x;          // Logical grid X
                this.y = y;          // Logical grid Y
                this.px = x * TILE_SIZE; // Render pixel X
                this.py = y * TILE_SIZE; // Render pixel Y
                this.tx = x;         // Target Grid X
                this.ty = y;         // Target Grid Y
                this.moving = false; 
                this.speed = speed;  // Pixels per frame
                this.type = type;    
            }

            updateMovement() {
                if (this.moving) {
                    let dx = (this.tx * TILE_SIZE) - this.px;
                    let dy = (this.ty * TILE_SIZE) - this.py;
                    let dist = Math.hypot(dx, dy);

                    if (dist <= this.speed) {
                        // Snap exactly to target
                        this.px = this.tx * TILE_SIZE;
                        this.py = this.ty * TILE_SIZE;
                        this.x = this.tx;
                        this.y = this.ty;
                        this.moving = false;
                        if (this.onReachTarget) this.onReachTarget();
                    } else {
                        // Move steadily towards target
                        this.px += (dx / dist) * this.speed;
                        this.py += (dy / dist) * this.speed;
                    }
                }
            }

            draw() {
                ctx.font = "26px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                let emoji = ASSETS[this.type.toUpperCase()] || '❓';
                ctx.fillText(emoji, this.px + TILE_SIZE / 2, this.py + TILE_SIZE / 2 + 2);
            }
        }

        // Player Class
        class Player extends Entity {
            constructor(x, y) {
                super(x, y, 'player', 4); // Fast movement
                this.maxBombs = 3;
            }

            update() {
                // Input handling buffered for continuous movement
                let nextDir = null;
                if (keys['ArrowUp'] || keys['w']) nextDir = { x: 0, y: -1 };
                else if (keys['ArrowDown'] || keys['s']) nextDir = { x: 0, y: 1 };
                else if (keys['ArrowLeft'] || keys['a']) nextDir = { x: -1, y: 0 };
                else if (keys['ArrowRight'] || keys['d']) nextDir = { x: 1, y: 0 };

                if (!this.moving && nextDir) {
                    let nx = this.x + nextDir.x;
                    let ny = this.y + nextDir.y;
                    if (isWalkable(nx, ny)) {
                        this.tx = nx;
                        this.ty = ny;
                        this.moving = true;
                    }
                }

                // Bomb Placement
                if (keys[' '] && !spacePressed) {
                    spacePressed = true;
                    let activeBombs = bombs.filter(b => b.owner === this).length;
                    
                    if (activeBombs < this.maxBombs) {
                        // Determine grid position based on logical target coordinate to allow dropping while sliding
                        let dropX = this.moving ? this.tx : this.x;
                        let dropY = this.moving ? this.ty : this.y;
                        
                        // Prevent placing multiple bombs on same spot
                        if (!bombs.some(b => b.gridX === dropX && b.gridY === dropY)) {
                            bombs.push(new Bomb(dropX, dropY, 150, this)); // 150 frames = 2.5 seconds
                        }
                    }
                }
                if (!keys[' ']) {
                    spacePressed = false;
                }

                this.updateMovement();
            }
        }

        // Enemy Class
        class Enemy extends Entity {
            constructor(x, y, type) {
                let speed = 2;
                if (type === 'blitzcrank') speed = 4;
                super(x, y, type, speed);
                
                this.dirX = 0;
                this.dirY = 0;
                this.shacoTimer = 0;
            }

            update() {
                if (this.type === 'shaco') {
                    this.shacoTimer++;
                    if (this.shacoTimer >= 360) { // Teleport every 6 seconds
                        this.shacoTimer = 0;
                        this.teleport();
                    }
                }

                if (!this.moving) {
                    this.decideNextMove();
                }
                this.updateMovement();
            }

            decideNextMove() {
                let validDirs = [[0,1], [1,0], [0,-1], [-1,0]].filter(d => isWalkable(this.x + d[0], this.y + d[1]));

                if (this.type === 'blitzcrank') {
                    // Blitzcrank moves in lines until he hits a wall
                    if (this.dirX !== 0 || this.dirY !== 0) {
                        if (isWalkable(this.x + this.dirX, this.y + this.dirY)) {
                            this.tx = this.x + this.dirX;
                            this.ty = this.y + this.dirY;
                            this.moving = true;
                            return;
                        }
                    }
                    // Hit wall or first move: pick new random valid dir
                    if (validDirs.length > 0) {
                        let d = validDirs[Math.floor(Math.random() * validDirs.length)];
                        this.dirX = d[0]; this.dirY = d[1];
                        this.tx = this.x + d[0]; this.ty = this.y + d[1];
                        this.moving = true;
                    } else {
                        this.dirX = 0; this.dirY = 0;
                    }
                } else {
                    // Garen & Shaco default behavior: random adjacent tile
                    if (validDirs.length > 0) {
                        let d = validDirs[Math.floor(Math.random() * validDirs.length)];
                        this.tx = this.x + d[0];
                        this.ty = this.y + d[1];
                        this.moving = true;
                    }
                }
            }

            teleport() {
                let floors = [];
                for (let r = 1; r < ROWS - 1; r++) {
                    for (let c = 1; c < COLS - 1; c++) {
                        if (isWalkable(c, r)) {
                            // Don't teleport directly on top of the player
                            if (Math.abs(c - player.x) > 2 || Math.abs(r - player.y) > 2) {
                                floors.push({c, r});
                            }
                        }
                    }
                }
                if (floors.length > 0) {
                    let dest = floors[Math.floor(Math.random() * floors.length)];
                    this.x = dest.c;
                    this.y = dest.r;
                    this.tx = dest.c;
                    this.ty = dest.r;
                    this.px = dest.c * TILE_SIZE;
                    this.py = dest.r * TILE_SIZE;
                    this.moving = false;
                    this.dirX = 0;
                    this.dirY = 0;
                }
            }
        }

        // Bomb Class
        class Bomb {
            constructor(x, y, timer, owner) {
                this.gridX = x;
                this.gridY = y;
                this.timer = timer;
                this.owner = owner;
                
                // Animation properties
                this.scale = 1;
                this.scaleDir = 0.01;
            }

            update() {
                this.timer--;
                
                // Breathing animation for bomb
                this.scale += this.scaleDir;
                if (this.scale > 1.15 || this.scale < 0.95) this.scaleDir *= -1;

                if (this.timer <= 0) {
                    this.explode();
                }
            }

            explode() {
                bombs.splice(bombs.indexOf(this), 1);
                createExplosion(this.gridX, this.gridY);
            }

            draw() {
                ctx.save();
                ctx.translate(this.gridX * TILE_SIZE + TILE_SIZE/2, this.gridY * TILE_SIZE + TILE_SIZE/2 + 2);
                ctx.scale(this.scale, this.scale);
                ctx.font = "26px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(ASSETS.BOMB, 0, 0);
                ctx.restore();
            }
        }

        // Generate Explosion Rays
        function createExplosion(cx, cy) {
            addExplosionTile(cx, cy);

            let dirs = [[1,0], [-1,0], [0,1], [0,-1]];
            for (let d of dirs) {
                for (let i = 1; i <= 2; i++) { // Explosion radius = 2
                    let nx = cx + d[0] * i;
                    let ny = cy + d[1] * i;
                    
                    // Out of bounds check (technically covered by indestructible walls)
                    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) break;

                    if (map[ny][nx] === 1) {
                        break; // Stop at Indestructible wall
                    }
                    
                    if (map[ny][nx] === 2) {
                        map[ny][nx] = 0; // Destroy block
                        addExplosionTile(nx, ny);
                        break; // Explosion ray stops after hitting a block
                    }

                    // Chain reaction: If ray hits another bomb, set its timer to 0
                    let hitBomb = bombs.find(b => b.gridX === nx && b.gridY === ny);
                    if (hitBomb && hitBomb.timer > 0) {
                        hitBomb.timer = 0;
                    }

                    addExplosionTile(nx, ny);
                }
            }
        }

        function addExplosionTile(x, y) {
            if (!explosions.some(e => e.x === x && e.y === y)) {
                explosions.push({ x: x, y: y, timer: 15 }); // Lingers for 15 frames (~250ms)
            }
        }

        // Rectangle overlap check (simplified for grid entities)
        function checkCollision(ent1, ent2) {
            let r1 = { x: ent1.px + 8, y: ent1.py + 8, w: TILE_SIZE - 16, h: TILE_SIZE - 16 };
            let r2 = { x: ent2.px + 8, y: ent2.py + 8, w: TILE_SIZE - 16, h: TILE_SIZE - 16 };
            return (r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
                    r1.y < r2.y + r2.h && r1.y + r1.h > r2.y);
        }

        function rectIntersectPoint(rect, px, py) {
            return (px >= rect.x && px <= rect.x + rect.w &&
                    py >= rect.y && py <= rect.y + rect.h);
        }

        // Initialize Game State
        function initEntities() {
            player = new Player(1, 1);
            enemies = [];
            
            // Gather valid spawn locations far from the player
            let spawns = [];
            for (let r = 6; r < ROWS - 1; r++) {
                for (let c = 6; c < COLS - 1; c++) {
                    if (map[r][c] === 0) spawns.push({c, r});
                }
            }
            
            // Shuffle
            spawns.sort(() => Math.random() - 0.5);
            
            // Spawn League Enemies
            if (spawns.length > 0) enemies.push(new Enemy(spawns.pop().c, spawns.pop().r, 'garen'));
            if (spawns.length > 0) enemies.push(new Enemy(spawns.pop().c, spawns.pop().r, 'garen'));
            if (spawns.length > 0) enemies.push(new Enemy(spawns.pop().c, spawns.pop().r, 'blitzcrank'));
            if (spawns.length > 0) enemies.push(new Enemy(spawns.pop().c, spawns.pop().r, 'shaco'));
            
            bombs = [];
            explosions = [];
            gameOver = false;
            gameWon = false;
            
            uiLayer.classList.add('hidden');
            keys = {}; // reset input state
        }

        function setGameOver(win) {
            if (gameOver || gameWon) return;
            gameOver = !win;
            gameWon = win;
            
            uiTitle.innerText = win ? "VICTORY!" : "GAME OVER";
            uiTitle.className = win ? "text-4xl mb-6 text-center text-yellow-400 font-bold" : "text-4xl mb-6 text-center text-red-500 font-bold";
            uiLayer.classList.remove('hidden');
        }

        // Main Logic Update
        function updateGame() {
            player.update();

            // Update Enemies
            for (let enemy of enemies) {
                enemy.update();
            }

            // Update Bombs
            // Loop backwards because explode() mutates the array
            for (let i = bombs.length - 1; i >= 0; i--) {
                bombs[i].update();
            }

            // Update Explosions and Handle Damage
            for (let i = explosions.length - 1; i >= 0; i--) {
                let exp = explosions[i];
                exp.timer--;
                
                let expHitbox = { x: exp.x * TILE_SIZE, y: exp.y * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE };
                
                // Kills Player?
                let pBox = { x: player.px + 8, y: player.py + 8, w: TILE_SIZE - 16, h: TILE_SIZE - 16 };
                if (pBox.x < expHitbox.x + expHitbox.w && pBox.x + pBox.w > expHitbox.x &&
                    pBox.y < expHitbox.y + expHitbox.h && pBox.y + pBox.h > expHitbox.y) {
                    setGameOver(false);
                }

                // Kills Enemies?
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let enBox = { x: enemies[j].px + 8, y: enemies[j].py + 8, w: TILE_SIZE - 16, h: TILE_SIZE - 16 };
                    if (enBox.x < expHitbox.x + expHitbox.w && enBox.x + enBox.w > expHitbox.x &&
                        enBox.y < expHitbox.y + expHitbox.h && enBox.y + enBox.h > expHitbox.y) {
                        enemies.splice(j, 1);
                    }
                }

                if (exp.timer <= 0) {
                    explosions.splice(i, 1);
                }
            }

            // Collision between Player and Enemies
            for (let enemy of enemies) {
                if (checkCollision(player, enemy)) {
                    setGameOver(false);
                }
            }

            // Check Win Condition
            if (enemies.length === 0 && !gameOver) {
                setGameOver(true);
            }
        }

        // Render Frame
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Map
            ctx.font = "30px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let type = map[r][c];
                    let xPos = c * TILE_SIZE + TILE_SIZE / 2;
                    let yPos = r * TILE_SIZE + TILE_SIZE / 2 + 2;

                    if (type === 1) {
                        ctx.fillText(ASSETS.WALL, xPos, yPos);
                    } else if (type === 2) {
                        ctx.fillText(ASSETS.BOX, xPos, yPos);
                    }
                }
            }

            // Draw Bombs
            for (let bomb of bombs) bomb.draw();

            // Draw Explosions
            ctx.font = "32px Arial";
            for (let exp of explosions) {
                ctx.fillText(ASSETS.EXPLOSION, exp.x * TILE_SIZE + TILE_SIZE / 2, exp.y * TILE_SIZE + TILE_SIZE / 2 + 2);
            }

            // Draw Enemies
            for (let enemy of enemies) enemy.draw();

            // Draw Player
            player.draw();
        }

        // Main Loop
        function gameLoop(time) {
            if (!lastTime) lastTime = time;
            let delta = time - lastTime;
            lastTime = time;

            // Cap delta to prevent spiral of death on long frames (e.g. background tab)
            if (delta > 250) delta = 250;
            accumulator += delta;

            // Fixed time steps for consistent logic updates across devices
            while (accumulator >= TIME_STEP) {
                if (!gameOver && !gameWon) {
                    updateGame();
                }
                accumulator -= TIME_STEP;
            }

            drawGame();
            requestAnimationFrame(gameLoop);
        }

        // Setup Event Listeners
        restartBtn.addEventListener('click', () => {
            initMap();
            initEntities();
        });

        // Bootstrap Game
        window.onload = () => {
            initMap();
            initEntities();
            requestAnimationFrame(gameLoop);
        };

    </script>
</body>
</html>
